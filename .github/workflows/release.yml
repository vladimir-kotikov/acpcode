name: Build and Publish

# Push a vX.Y.Z tag -> publish that exact version to the Marketplace.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing: vsce trades the job's OIDC token for a short-lived
    # Marketplace credential, so there's no PAT secret. Needs a policy for this
    # repo + workflow on the publisher's Marketplace management page.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set version from tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      # Bundles everything and packages only what ships (see the Makefile).
      - run: make prod
      - run: npx @vscode/vsce@^4 publish --oidc --packagePath acpcode.vsix
